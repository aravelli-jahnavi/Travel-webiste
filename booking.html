<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Booking Confirmation</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
</head>
<body class="p-4">
    <div class="container">
        <h3 class="mb-4">Booking Confirmation</h3>

        <div id="package-details" class="alert alert-info"></div>

        <form action="submit_booking.php" method="POST">
            <input type="hidden" name="selected_package" id="hidden-package">

            <div class="form-group">
                <label for="name">Full Name</label>
                <input required type="text" class="form-control" name="name" id="name">
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input required type="email" class="form-control" name="email" id="email">
            </div>

            <div class="form-group">
                <label for="phone">Phone Number</label>
                <input required type="tel" class="form-control" name="phone" id="phone">
            </div>

            <button type="submit" class="btn btn-success">Submit Booking</button>
        </form>
    </div>

    <script>
        // Get URL parameter
        const urlParams = new URLSearchParams(window.location.search);
        const selectedPackage = urlParams.get('selected_package');

        // Display in div
        document.getElementById("package-details").innerText = `You selected: ${selectedPackage}`;

        // Set hidden input
        document.getElementById("hidden-package").value = selectedPackage;
    </script>
</body>
</html>
